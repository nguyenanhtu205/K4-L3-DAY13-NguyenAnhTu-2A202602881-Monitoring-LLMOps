alerts:
  - name: User-visible latency elevated
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000 ms
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: LLM Platform on-call
    runbook: docs/alerts.md#alert-1
  - name: Request failure rate elevated
    severity: critical
    condition: request_failed / request_received > 2%
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: API on-call
    runbook: docs/alerts.md#alert-2
  - name: Retrieval success degraded
    severity: warning
    condition: retrieval tool_success rate < 90%
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: Retrieval on-call
    runbook: docs/alerts.md#alert-3
